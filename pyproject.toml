[project]
name = "instantly-mcp"
dynamic = ["version"]
description = "MCP server wrapping the Instantly.ai v2 API (analytics, leads, campaigns, unibox, accounts) with per-action safety gates and an autonomy policy."
keywords = ["mcp", "model-context-protocol", "instantly", "cold-email", "claude", "llm-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Pinned to the 1.x line. mcp 2.x renamed FastMCP to MCPServer and reshaped
    # the auth provider APIs this server builds on (auth.py, oauth.py), so an
    # unpinned install resolves to 2.x and fails at import. Migrating to 2.x is
    # tracked work, not a version-range tweak.
    "mcp>=1.2.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "pyright>=1.1.380",
]

[project.urls]
Homepage = "https://github.com/katekruger/instantly-mcp"
Repository = "https://github.com/katekruger/instantly-mcp"
Documentation = "https://github.com/katekruger/instantly-mcp#documentation"
Issues = "https://github.com/katekruger/instantly-mcp/issues"

[project.scripts]
instantly-mcp = "instantly_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# Single source of truth for the version: __version__ in __init__.py. Before
# this, pyproject.toml's `version` and __init__.py's `__version__` were two
# separate literals that could silently drift -- release.yml's tag-matches-
# version check needs exactly one place to read from.
path = "src/instantly_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/instantly_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Correctness and import hygiene. Stylistic modernization rules (UP) are left
# off deliberately: `Optional[X]` reads fine and churning 900 lines of working
# tool definitions to satisfy a preference is not worth the diff.
select = ["E", "F", "W", "I", "B"]

[tool.coverage.run]
source = ["src/instantly_mcp"]
branch = true

[tool.coverage.report]
# No fail-under gate yet: the baseline needs to be measured before a threshold
# means anything. Once CI has run a few times, set one here (start at the
# measured floor, not at 100 -- policy.py's untestable branches, e.g. the
# audit-log OSError swallow paths that require monkeypatching open(), keep
# it under 100 honestly).
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
# "basic" (pyright's own default -- pinned explicitly rather than left to
# whatever the tool's default becomes later) rather than "strict": strict
# would additionally demand annotations pyright can't infer through the mcp
# SDK's own partially-typed surface and the deliberate plain `dict` / Any
# tool signatures noted in models.py's docstring (FastMCP generates simpler
# JSON schemas from them). "basic" already catches real bugs -- it's what
# found every fix in this project's first type-check pass -- without
# demanding an unrelated rewrite to reach "strict".
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
