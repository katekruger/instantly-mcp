name: zizmor

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

jobs:
  zizmor:
    name: zizmor GitHub Actions security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run zizmor
        run: pipx run zizmor --format sarif . > results.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF file
        # continue-on-error until code scanning is confirmed enabled for this
        # repo (Settings -> Code security -> Code scanning). Public repos get
        # it for free, but it is not on by default the moment a repo goes
        # public -- remove this once a real run has uploaded successfully
        # (see the same note in segment-mcp's zizmor.yml, which went through
        # this exact transition).
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
          category: zizmor
